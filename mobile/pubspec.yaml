name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0
  camera: ^0.12.1
  url_launcher: ^6.3.3
  image_cropper: ^13.0.0
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^17.0.1

  # Package Google Auth & API (Dipindahkan ke dependencies utama)
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/image/logo.png" # Path logo kamu
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/assets/image/
    - lib/assets/icons/